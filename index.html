<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14202e;--mut:#667385;--line:#e2e7ee;--side:#0f1b2a;--acc:#0e6b73;--acc2:#e3f1f2;--ok:#1f7a55;--okb:#e2f2ea;--warn:#9a6208;--warnb:#fbefd6;--bad:#a23a56;--badb:#f8e4ea;--f:'Century Gothic',CenturyGothic,'Apple Gothic',Questrial,'Segoe UI',sans-serif;font-family:var(--f)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside.nav{background:var(--side);color:#c5d0de;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{font-family:var(--f);font-size:20px;color:#fff;padding:2px 10px 22px;display:flex;gap:10px;align-items:center}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff}
.nb{display:flex;gap:11px;align-items:center;padding:10px 12px;border:0;border-radius:10px;background:none;color:inherit;cursor:pointer;text-align:left;transition:background .15s}
.nb:hover{background:#ffffff12}.nb[aria-current=page]{background:#ffffff1c;color:#fff}
.nstat{margin-top:auto;padding:12px;border-radius:10px;background:#ffffff0d;font-size:12px;color:#93a3b8;line-height:1.7}
.nstat b{color:#e6edf6;font-weight:500}
main{padding:26px 30px 40px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:14px 22px;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
h1{font-family:var(--f);font-weight:600;font-size:27px;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);margin-top:3px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,.in{height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 12px;min-width:0}
.btn{height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 14px;display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-weight:500;transition:background .15s,transform .1s}
.btn:hover{background:#f6f8fa}.btn:active{transform:translateY(1px)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{background:#0b5a61}
.btn.d{color:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px #14202e0a}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}.kpi small{color:var(--mut);display:flex;gap:7px;align-items:center}
.kpi .v{font-family:var(--f);font-size:25px;font-weight:600;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .n{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.k-bad{border-color:#e9c3cd}.kpi.k-ok{border-color:#bfe0cf}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.tb{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.tb h2,.sh h2{font-size:15px;margin:0;font-weight:600}.grow{flex:1}
.srch{position:relative;width:min(280px,100%)}.srch svg{position:absolute;left:11px;top:10px;color:var(--mut)}.srch .in{width:100%;padding-left:34px}
.tw{overflow:auto;max-height:560px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#f7f9fb;text-align:left;font-weight:500;color:var(--mut);padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer;padding:10px 12px;display:flex;gap:6px;align-items:center;width:100%;box-sizing:border-box}
th.r button{justify-content:flex-end}th span.t{padding:10px 12px;display:block}
td{padding:9px 12px;border-bottom:1px solid #eef1f5;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:#f8fafb}.r{text-align:right;font-variant-numeric:tabular-nums}
td.r input{width:110px;text-align:right;height:30px}
.chip{display:inline-flex;gap:5px;align-items:center;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:500}
.c-conforme{background:var(--okb);color:var(--ok)}.c-ecart{background:var(--warnb);color:var(--warn)}.c-acompleter{background:var(--warnb);color:var(--warn)}.c-absent{background:#e6ecf8;color:#34498a}.c-clepresente{background:#e6ecf8;color:#34498a}.c-manquant{background:var(--badb);color:var(--bad)}
.neg{color:var(--bad)}.pos{color:var(--warn)}
.pg{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;flex-wrap:wrap}
.pg .tot{font-weight:600}.pg .btn{height:32px;padding:0 10px}
.sh{padding:14px 16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.badge{background:var(--badb);color:var(--bad);border-radius:99px;padding:1px 9px;font-weight:600;font-size:12px}
.list{max-height:520px;overflow:auto}
.an{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:12px 16px;border-bottom:1px solid #eef1f5;cursor:pointer}
.an:hover{background:#fafbfc}.an b{font-weight:600}.an .m{color:var(--mut);font-size:12px;margin:2px 0 6px}
.an .nums{display:flex;gap:12px;font-size:12px;flex-wrap:wrap;align-items:center}
.an .in{height:30px;width:112px;text-align:right}
.sf{padding:12px 16px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--line)}
.empty{padding:44px 24px;text-align:center;color:var(--mut)}
.empty .ic{width:46px;height:46px;border-radius:14px;margin:0 auto 12px;display:grid;place-items:center;background:var(--acc2);color:var(--acc)}
.empty.ok .ic{background:var(--okb);color:var(--ok)}.empty h3{margin:0 0 4px;color:var(--ink);font-size:15px}
.imp{display:grid;grid-template-columns:1fr 1fr;gap:16px}.imp .card{padding:20px}
.imp h2{margin:0 0 3px;font-size:16px}.meta{color:var(--mut);font-size:12.5px;margin-bottom:14px}
.dz{display:block;border:1.5px dashed #b9c5d3;border-radius:12px;padding:26px 16px;text-align:center;cursor:pointer;color:var(--mut);transition:.15s;position:relative}
.dz:hover,.dz.on,.dz:focus-within{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.dz input{position:absolute;opacity:0;inset:0;cursor:pointer}.dz b{display:block;color:var(--ink);margin:6px 0 2px}
.bar{height:6px;background:#e8edf2;border-radius:9px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.msg{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:13px}.msg ul{margin:6px 0 0;padding-left:18px}
.m-ok{background:var(--okb);color:#175c40}.m-warn{background:var(--warnb);color:#74490a}.m-err{background:var(--badb);color:#80283f}.m-run{background:#eef1f5}
.rules{margin-top:16px;padding:20px}.rules h2{font-size:16px;margin:0 0 10px}
.rules div{display:grid;grid-template-columns:1fr 1fr;gap:6px 30px}.rules li{margin-bottom:5px}.rules ul{margin:0;padding-left:18px}
.rules code{background:#eef1f5;border-radius:5px;padding:1px 5px;font-size:12px}
dialog{border:0;border-radius:16px;padding:0;width:min(460px,92vw);box-shadow:0 24px 60px #0f1b2a40}
dialog::backdrop{background:#0f1b2a80}.dg{padding:24px}.dg h3{margin:0 0 8px;font-family:var(--f);font-size:19px}
.dg .f{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:9}
.toast{background:var(--side);color:#fff;padding:11px 16px;border-radius:11px;box-shadow:0 8px 24px #0f1b2a40;animation:ti .2s}
.toast.e{background:#80283f}@keyframes ti{from{opacity:0;transform:translateY(8px)}}
svg.i{flex:none;vertical-align:middle}
@media(max-width:1180px){.split{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){.app{grid-template-columns:1fr}aside.nav{position:static;height:auto;flex-direction:row;padding:10px;overflow:auto}.logo,.nstat{display:none}main{padding:18px 14px}.imp,.rules div{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Affinage visuel */
*{scrollbar-width:thin;scrollbar-color:#c5cfda transparent}
body{background:radial-gradient(1100px 480px at 88% -12%,#d9e8ee 0,transparent 62%),var(--bg);-webkit-font-smoothing:antialiased}
aside.nav{background:linear-gradient(180deg,#10202f,#0a1420);border-right:1px solid #ffffff10}
.nb{position:relative;font-weight:500;color:#9fb0c4}.nb:hover{color:#fff}
.nb[aria-current=page]{background:linear-gradient(90deg,#ffffff22,#ffffff08);color:#fff}

.logo i{background:linear-gradient(135deg,#17a0aa,#0e6b73);box-shadow:0 4px 14px #0e6b7366}

.btn.p{background:linear-gradient(180deg,#128089,#0e6b73);box-shadow:0 3px 10px #0e6b7340}

.card{border-radius:16px;box-shadow:0 1px 2px #14202e08,0 10px 28px -14px #14202e26}

.kpi{padding:18px 20px;transition:transform .2s,box-shadow .2s}

.ki{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--acc2);color:var(--acc);flex:none}

.tb{padding:16px 18px}.tb h2{font-family:var(--f);font-size:17px;font-weight:600}
.srch .in{background:#f4f7fa;border-color:transparent}.srch .in:focus{background:#fff}
th{background:#f4f7fa;font-size:12px;letter-spacing:.02em}
td{padding:11px 14px}td:first-child{font-weight:500}
tbody tr:nth-child(even) td{background:#fbfcfd}

.chip{padding:3px 10px 3px 8px}
.pg{background:#fafbfc;border-top:1px solid var(--line)}
.split>aside{position:sticky;top:104px}
.list{max-height:calc(100vh - 330px)}

.an.s-ecart{border-left-color:#e2ab45}.an.s-absent{border-left-color:#5f78c4}.an.s-clepresente{border-left-color:#7c8fb6}
.an.sel{background:var(--acc2)}
.an input[type=checkbox],.sh input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px;margin-top:2px}
.sf{background:#fafbfc}.sf .btn{width:100%;justify-content:center}
.empty .ic{width:56px;height:56px;border-radius:18px}
.dz{background:#fafcfd;padding:34px 16px}
.dz svg{width:48px;height:48px;padding:12px;border-radius:14px;background:var(--acc2);color:var(--acc)}
.bar i{background:linear-gradient(90deg,#17a0aa,#0e6b73)}
.imp .card,.rules{padding:22px}
dialog{border-radius:18px}
@keyframes fi{from{opacity:0;transform:translateY(6px)}}
#view>*{animation:fi .35s ease both}.kpi{animation:fi .45s ease both}
.kpi:nth-child(2){animation-delay:.04s}.kpi:nth-child(3){animation-delay:.08s}.kpi:nth-child(4){animation-delay:.12s}.kpi:nth-child(5){animation-delay:.16s}
@media(max-width:1180px){.split>aside{position:static}.list{max-height:480px}}
@media(max-width:860px){.top{margin:-18px -14px 18px;padding:16px 14px 12px}.nb[aria-current=page]::before{display:none}}

.seg{display:inline-flex;background:#eaeef3;border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.sg{border:0;background:none;padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--mut);transition:background .15s,color .15s}
.sg:hover{color:var(--ink)}.sg[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px #14202e24}
.sg em{font-style:normal;margin-left:7px;font-size:12px;opacity:.65;font-variant-numeric:tabular-nums}
.stf{padding:10px 16px;border-bottom:1px solid var(--line)}
.c-imp{background:#e8eef3;color:#41566b}
.insight{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 18px;margin-bottom:16px;border-radius:16px;background:linear-gradient(100deg,#10283a,#134550);color:#d5e6ea;box-shadow:0 14px 32px -18px #0f2a3acc}
.insight.ok{background:linear-gradient(100deg,#11362d,#1a604a)}
.insight b{color:#fff;font-weight:600}.insight .grow{min-width:240px}
.insight .ki{background:#ffffff1f;color:#8fe6dc}
.insight .btn{background:#ffffff14;border-color:#ffffff2e;color:#fff;box-shadow:none}.insight .btn:hover{background:#ffffff26}
.insight .btn.p{background:#fff;border-color:#fff;color:#0e4f56;box-shadow:none}

.cs{height:30px;font-size:12.5px;font-weight:400;padding:0 26px 0 8px;border-radius:8px;background-position:right 8px center}
table{font-size:12.5px}.kpi .v{font-size:25px}h1{font-size:26px}
.btn.sm{height:28px;padding:0 11px;font-size:12px;border-radius:8px}
.lnk{all:unset;color:var(--acc);cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:3px;font-size:12px}.lnk:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px}.dgrid small,.cmp small{display:block;color:var(--mut);font-size:11.5px;margin-bottom:2px}.dgrid b{font-weight:500;overflow-wrap:anywhere}

/* Tableau de bord : synthèse et pilotage */
.db-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:22px 24px;margin-bottom:16px;border-radius:18px;color:#e4f0f2;background:radial-gradient(circle at 88% 0%,#26717a 0,transparent 38%),linear-gradient(115deg,#102637,#12474e);box-shadow:0 16px 34px -22px #102637a8}
.db-hero .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9ddad8;font-weight:600}
.db-hero h2{font-size:22px;line-height:1.25;color:#fff;margin:7px 0 6px;font-weight:600;letter-spacing:-.02em}

.db-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:16px}
.db-kpi{min-width:0;padding:17px 18px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 7px 22px -18px #14202e55}
.db-kpi .db-label{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px;font-weight:500}

.db-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:15px;margin-bottom:15px;align-items:stretch}

 const bucket=kind==='src'?S.src:S.ref,label=kind==='src'?'DATA_RENTA_COUT':'BUDGET | CA REALISEE';

async function gdDownloadArchive(item){
 let payload;

 if(!archive||!archive.id||!Array.isArray(archive.rows))throw new Error(`Le fichier « ${item.name} » n’est pas une archive reconnue.`);
 const knownStem=gdStemFromFilename(item.name);if(knownStem)archive.archiveStem=knownStem;archive.cloud={provider:'Google Drive',itemId:item.id,fileName:item.name,webUrl:item.webViewLink||'',syncedAt:new Date().toISOString()};return archive;
}
async function gdSyncAll(options={}){
 const silent=!!options.silent;if(GD.busy)return;GD.busy=true;GD.lastError='';
 try{
  if(!gdHasToken())throw new Error('Connectez-vous à Google Drive avant de synchroniser.');
  await gdEnsureFolder();await gdMoveRootArchivesIntoFolder();
  let remote=await gdListFiles();
  // Applique les suppressions différées, en couvrant les paires JSON + Excel.
  const tombstones=new Set((await dbGet('googleDriveTombstones'))||[]),remainingTombstones=new Set(tombstones);
  for(const f of remote){if(!tombstones.has(f.name))continue;try{await gdApi(`/files/${encodeURIComponent(f.id)}`,{method:'DELETE'});remainingTombstones.delete(f.name)}catch(e){console.warn('Suppression Drive différée',e)}}
  if(remainingTombstones.size!==tombstones.size)await dbSet('googleDriveTombstones',[...remainingTombstones]);
  remote=await gdListFiles();
  // Réintègre les archives JSON présentes dans le dossier mais absentes de l’historique local.
  const remoteJson=remote.filter(gdIsArchiveJson);
  for(const f of remoteJson){
   const linked=S.history.find(a=>a?.cloud?.itemId===f.id||a?.cloud?.fileName===f.name||a?.archiveStem&&`${a.archiveStem}.json`===f.name||gdLegacyFileName(a)===f.name);
   if(linked){if(!linked.archiveStem){const st=gdStemFromFilename(f.name);if(st)linked.archiveStem=st}continue}
   try{
    const incoming=await gdDownloadArchive(f),same=S.history.find(a=>a.id===incoming.id);
    if(same){same.cloud=incoming.cloud;if(!same.archiveStem&&incoming.archiveStem)same.archiveStem=incoming.archiveStem}
    else S.history.push(incoming);
   }catch(e){console.warn(e);if(!silent)toast(e.message,1)}
  }
  gdEnsureLocalArchiveStems(remainingTombstones);
  // Synchronise chaque archive sous la même base de nom, en JSON et Excel.
  // Les anciens fichiers JSON sont renommés/migrés, pas supprimés ; les archives locales restent intactes.
  remote=await gdListFiles();
  const ordered=[...(S.history||[])].sort((a,b)=>new Date(a.archivedAt)-new Date(b.archivedAt));
  for(const a of ordered){
   const known=remote.find(f=>f.id===a?.cloud?.itemId||f.name===a?.cloud?.fileName||f.name===gdLegacyFileName(a)||f.name===`${a.archiveStem}.json`);
   if(known&&(!a.cloud||a.cloud.itemId!==known.id))a.cloud={...(a.cloud||{}),provider:'Google Drive',itemId:known.id,fileName:known.name,webUrl:known.webViewLink||''};
   await gdUploadArchive(a,remote);
  }
  S.history.sort((a,b)=>new Date(b.archivedAt)-new Date(a.archivedAt));await dbSet('archiveHistory',S.history);
  GD.lastSyncAt=new Date().toISOString();GD.lastError='';
  if(!silent)toast(`Google Drive synchronisé : ${S.history.length.toLocaleString('fr-FR')} archive(s), chacune en JSON et Excel dans « ${GD_FOLDER_NAME} ».`);
 }catch(e){GD.lastError=e?.message||String(e);if(!silent)toast('Synchronisation Google Drive impossible : '+GD.lastError,1);else console.warn('Google Drive:',GD.lastError)}
 finally{GD.busy=false;if(S.view==='history')renderHistory()}
}

function archiveCurrentReconciliation(){
 const rows=tableRows();
 if(!rows.length){toast('Aucune ligne dans le tableau actuel à archiver.',1);return}
 const period=archivePeriodLabel({year:S.year,month:S.month});
 const sourceTotal=r2(rows.reduce((sum,r)=>sum+(r.ca==null?0:r.ca),0));
 const referenceTotal=r2(rows.reduce((sum,r)=>sum+(r.refCa==null?0:r.refCa),0));
 const effectiveTotal=r2(rows.reduce((sum,r)=>sum+(r.refEff==null?0:r.refEff),0));
 const gap=r2(sourceTotal-effectiveTotal);
 const statusLabel=S.st?(LBL[S.st]?.[1]||S.st):'Tous les statuts';
 ask('Archiver le rapprochement',`<div class="rounded-xl border border-teal-200 bg-teal-50 p-4 text-sm text-slate-700"><p>Vous allez enregistrer un <b>instantané indépendant</b> du tableau <b>BUDGET | CA REALISEE · CA repris de DATA_RENTA_COUT</b>.</p><div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4"><div><span class="block text-xs text-slate-500">Lignes incluses</span><b>${rows.length.toLocaleString('fr-FR')}</b></div><div><span class="block text-xs text-slate-500">CA source</span><b>${fmt(sourceTotal)}</b></div><div><span class="block text-xs text-slate-500">CA de référence</span><b>${fmt(referenceTotal)}</b></div><div><span class="block text-xs text-slate-500">Écart net retenu</span><b>${fmt(gap)}</b></div></div><p class="mt-3 text-xs text-slate-600">Période : <b>${esc(period)}</b> · Statut : <b>${esc(statusLabel)}</b> · Recherche : <b>${esc(S.q||'Aucune')}</b>.</p></div><p class="mt-3 text-sm text-slate-600">Toute la liste filtrée est archivée, pas seulement la page actuellement visible. Les valeurs archivées ne seront pas modifiées par les changements ultérieurs dans les données actives.</p><p class="mt-2 text-sm text-slate-600">Avec Google Drive connecté, deux fichiers assortis seront créés dans <b>Mon Drive / Archives rapprochement CA</b> : <code>Rapporchement_CA_2026_Aout.xlsx</code> et <code>Rapporchement_CA_2026_Aout.json</code> (année et mois adaptés à la période archivée). Si plusieurs archives concernent le même mois, un suffixe est ajouté pour conserver chaque version.</p>`,'Confirmer l’archivage',async()=>{
  const now=new Date();
  const snapshot={
   id:`arc-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`,
   archivedAt:now.toISOString(),period,rowCount:rows.length,
   filters:{year:S.year||'',month:S.month||'',baseYear:S.baseYear||'',baseMonth:S.baseMonth||'',search:S.q||'',status:S.st||'',statusLabel},
   files:{source:S.meta?.src?.name||'',reference:S.meta?.ref?.name||''},
   totals:{source:sourceTotal,reference:referenceTotal,referenceRetenue:effectiveTotal,gap},
   counts:Object.fromEntries(Object.keys(LBL).map(k=>[k,rows.filter(r=>r.status===k).length])),
   rows:rows.map(r=>({mois:r.mois,annee:r.annee,site:r.site||'',client:r.client||'',operation:r.operation||'',cle:r.cle||'',caSource:r.ca??null,caReference:r.refCa??null,caReferenceRetenu:r.refEff??null,ecart:r.ecart??null,status:r.status||'manquant'}))
  };
  try{const pendingDriveDeletes=new Set((await dbGet('googleDriveTombstones'))||[]);S.history.unshift(snapshot);gdEnsureLocalArchiveStems(pendingDriveDeletes);await dbSet('archiveHistory',S.history);if(gdHasToken()){try{await gdUploadArchive(snapshot);await dbSet('archiveHistory',S.history);if(S.view==='recon')renderRecon();toast(`Archive locale et Google Drive enregistrés : ${snapshot.archiveStem}.xlsx et ${snapshot.archiveStem}.json (${rows.length} ligne(s)).`)}catch(cloudErr){GD.lastError=cloudErr?.message||String(cloudErr);if(S.view==='recon')renderRecon();toast('Archive locale conservée ; envoi vers Google Drive impossible. Ouvrez Historique et relancez la synchronisation. '+GD.lastError,1)}}else{if(S.view==='recon')renderRecon();toast(`Archive locale enregistrée : ${rows.length} ligne(s). Connectez Google Drive dans Historique pour la sauvegarder dans le cloud.`)}}catch(err){S.history=S.history.filter(x=>x.id!==snapshot.id);toast('Impossible d’enregistrer l’archive : '+err.message,1)}
 });
}
function exportLocalArchiveBackup(){
 const payload={format:'rapprochement-ca-backup',schemaVersion:1,exportedAt:new Date().toISOString(),data:{src:S.src||[],ref:S.ref||[],meta:S.meta||{}},archives:(S.history||[]).map(a=>{const {cloud,...local}=a;return local})};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=`Rapprochement_CA_sauvegarde_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 toast(`Sauvegarde JSON exportée : ${payload.data.src.length.toLocaleString('fr-FR')} ligne(s) source, ${payload.data.ref.length.toLocaleString('fr-FR')} ligne(s) de référence, ${payload.archives.length.toLocaleString('fr-FR')} archive(s).`);

async function importLocalArchiveBackup(file){
 if(!file)return;
 try{
  const parsed=JSON.parse(await file.text());
  const arr=Array.isArray(parsed)?parsed:(parsed?.archives||parsed?.history||parsed?.data?.archives);
  if(!Array.isArray(arr))throw new Error('Ce fichier ne contient pas une liste d’archives reconnue.');
  const valid=arr.filter(a=>a&&typeof a.id==='string'&&Array.isArray(a.rows)&&a.archivedAt);
  if(!valid.length&&arr.length)throw new Error('Aucune archive valide : chaque archive doit avoir un identifiant, une date et des lignes.');
  const backupData=parsed?.data&&Array.isArray(parsed.data.src)&&Array.isArray(parsed.data.ref)?parsed.data:null;
  const restore=async()=>{
   let added=0,skipped=0;
   if(backupData){S.src=backupData.src;S.ref=backupData.ref;S.meta=backupData.meta||{};S.imp={};S.sel.clear();S.edits={};S.year='';S.month='';S.baseYear='';S.baseMonth='';S.srcYear='';S.srcMonth='';S.srcQ='';S.q='';S.bq='';S.st='';S.sort={k:null,d:1};S.page=S.bpage=S.srcPage=1;await save()}
   const ids=new Set(S.history.map(a=>a.id));
   for(const raw of valid){if(ids.has(raw.id)){skipped++;continue}const {cloud,...archive}=raw;S.history.push(archive);ids.add(archive.id);added++}
   S.history.sort((a,b)=>new Date(b.archivedAt)-new Date(a.archivedAt));await dbSet('archiveHistory',S.history);render();
   toast(`${backupData?'Données actives restaurées. ':''}${added} archive(s) importée(s), ${skipped} déjà présente(s).`);
  };
  if(backupData){
   ask('Restaurer la sauvegarde locale',`<div class="rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-slate-700"><b>Cette sauvegarde contient les données de l’application et l’historique.</b><p class="mt-2">Source DATA_RENTA_COUT : <b>${backupData.src.length.toLocaleString('fr-FR')}</b> ligne(s).</p><p>Base BUDGET | CA REALISEE : <b>${backupData.ref.length.toLocaleString('fr-FR')}</b> ligne(s).</p><p>Archives dans le fichier : <b>${valid.length.toLocaleString('fr-FR')}</b>.</p><p class="mt-3">La source, la base et les métadonnées actuellement utilisées sur cet appareil seront remplacées. Les archives nouvelles seront ajoutées sans dupliquer celles portant le même identifiant.</p></div>`,'Restaurer cette sauvegarde',restore);
  }else await restore();
 }catch(e){toast('Import de la sauvegarde impossible : '+(e?.message||e),1)}
}

 else if(a==='copy-recon-base'){S.baseYear=S.year||'';S.baseMonth=S.month||'';S.bpage=1;renderBase();toast('Affichage de la base aligné sur la période du rapprochement')}
 else if(a==='sync-base-recon'){S.year=S.baseYear||'';S.month=S.baseMonth||'';S.page=1;S.st='';S.sel.clear();S.view='recon';render();toast('Filtres de la base transférés au rapprochement')}
 else if(a==='sync-recon-source'){S.srcYear=S.year||'';S.srcMonth=S.month||'';S.srcPage=1;S.srcQ='';S.view='source';render();toast('Source affichée sur la même période que le rapprochement')}
 else if(a==='sync-source-recon'){S.year=S.srcYear||'';S.month=S.srcMonth||'';S.page=1;S.st='';S.sel.clear();S.view='recon';render();toast('Filtres source transférés au rapprochement')}
 else if(a==='sync-source-base'){S.baseYear=S.srcYear||'';S.baseMonth=S.srcMonth||'';S.bpage=1;S.view='base';render();toast('Affichage de la base aligné sur la période de la source')}
 else if(a==='sort'){const k=b.dataset.k;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:1};renderTable()}
 else if(a==='page'){const w=b.dataset.w,d=+b.dataset.d;if(w==='recon'){S.page+=d;renderTable()}else if(w==='src'){S.srcPage+=d;renderSource()}else{S.bpage+=d;renderBBody()}}
 else if(a==='export')exportXlsx();
 else if(a==='archive-recon')archiveCurrentReconciliation();
 else if(a==='history-recon')showArchiveHistory();
 else if(a==='gd-save-config'){gdSaveConfig($('#gdClientId')?.value).then(()=>toast('Paramètres Google Drive enregistrés sur cet appareil.')).catch(err=>toast(err.message||String(err),1))}
 else if(a==='gd-connect')gdConnect();
 else if(a==='gd-sync')gdSyncAll();
 else if(a==='gd-disconnect')gdDisconnect();
 else if(a==='exporthistoryjson')exportLocalArchiveBackup();
 else if(a==='viewarchive'){const ar=S.history.find(x=>x.id===b.dataset.id);showArchiveDetails(ar)}
 else if(a==='archiveback')showArchiveHistory();
 else if(a==='exportarchive')exportArchive(b.dataset.id);
 else if(a==='exportarchivejson')exportArchiveJSON(b.dataset.id);
 else if(a==='deletearchive'){const id=b.dataset.id,ar=S.history.find(x=>x.id===id);$('#dlg').close();ask('Supprimer cette archive ?',`<p>Cette action supprimera définitivement l’archive du <b>${esc(ar?archiveDateLabel(ar.archivedAt):'date inconnue')}</b> (${(ar?.rowCount??0).toLocaleString('fr-FR')} ligne(s)). Les fichiers Excel et JSON associés dans Google Drive seront également supprimés. Les données actives ne seront pas modifiées.</p>`,'Supprimer l’archive',async()=>{try{let cloudPending=false;if(ar?.cloud?.provider==='Google Drive'){const cloudFiles=Array.isArray(ar.cloud.files)?ar.cloud.files:[{id:ar.cloud.itemId,fileName:ar.cloud.fileName},{id:ar.cloud.excelItemId,fileName:ar.cloud.excelFileName}].filter(f=>f.id||f.fileName);const tombstones=new Set((await dbGet('googleDriveTombstones'))||[]);cloudFiles.forEach(f=>{if(f.fileName)tombstones.add(f.fileName)});await dbSet('googleDriveTombstones',[...tombstones]);if(gdHasToken()){for(const f of cloudFiles){if(!f.id)continue;try{await gdApi(`/files/${encodeURIComponent(f.id)}`,{method:'DELETE'});if(f.fileName)tombstones.delete(f.fileName)}catch(remoteErr){cloudPending=true;GD.lastError='Suppression Google Drive différée jusqu’à la prochaine synchronisation : '+(remoteErr.message||remoteErr)}}await dbSet('googleDriveTombstones',[...tombstones])}else cloudPending=cloudFiles.length>0}S.history=S.history.filter(x=>x.id!==id);await dbSet('archiveHistory',S.history);if(S.view==='recon')renderRecon();showArchiveHistory();toast(ar?.cloud?.provider==='Google Drive'?(cloudPending?'Archive locale supprimée ; les fichiers Drive seront supprimés à la prochaine synchronisation.':'Archive supprimée localement et sur Google Drive.'):'Archive locale supprimée.')}catch(err){toast('Suppression de l’archive impossible : '+err.message,1);showArchiveHistory()}})}
 else if(a==='detail')showDetail(b.dataset.k)
 else if(a==='globaldetail')showGlobalDetail()
 else if(a==='st'){S.st=b.dataset.k;S.page=1;renderTable()}
 else if(a==='exportbase')exportBase();
 else if(a==='exportsrc')exportSource();
 else if(a==='resetsrcfilters'){S.srcYear='';S.srcMonth='';S.srcQ='';S.srcPage=1;render()} 
 else if(a==='period')showBasePeriodDialog();
 else if(a==='applybaseperiod'){S.baseYear=$('#basePeriodYear')?.value||'';S.baseMonth=$('#basePeriodMonth')?.value||'';S.bpage=1;$('#dlg').close();renderBase()}
 else if(a==='resetbaseperiod'){S.baseYear='';S.baseMonth='';S.bpage=1;$('#dlg').close();renderBase()}
 else if(a==='clearfilters'){S.year='';S.month='';S.page=S.bpage=1;render()}
 else if(a==='resetall'){ask('Réinitialiser toutes les données ?',`<p>Cette action supprimera les deux fichiers importés, la base de référence, toutes les lignes insérées depuis Rapprochement et toutes les corrections enregistrées.</p><p><b>L’application reviendra à son état initial.</b> Cette action est irréversible ; exportez vos résultats si vous souhaitez les conserver.</p>`,'Tout réinitialiser',async()=>{S.src=[];S.ref=[];S.meta={};S.imp={};S.sel.clear();S.edits={};S.year='';S.month='';S.baseYear='';S.baseMonth='';S.srcYear='';S.srcMonth='';S.srcQ='';S.srcPage=1;S.q='';S.bq='';S.sort={k:null,d:1};S.page=S.bpage=1;S.mode='merge';S.bf='all';S.st='';S.dashOperation='';S.sideTab='verify';S.view='dash';await save();render();toast('Toutes les données ont été réinitialisées')})}
 else if(a==='selins'){S.sideTab='insert';S.sel=new Set(anoms().filter(isNewKeyAbsent).map(r=>r.k));renderSide();if(S.sel.size)$('[data-act=apply]')?.click();else toast('Aucune nouvelle ligne à insérer : les Corresp clés absentes sont déjà présentes dans la base.')}

 else if(a==='bf'){S.bf=b.dataset.k;S.bpage=1;renderBase()}
 else if(a==='cancel')$('#dlg').close();
 else if(a==='confirm'){$('#dlg').close();S.pending&&S.pending()}
 else if(a==='clear'){const k=b.dataset.k;if(k!=='src')return toast('La base de référence se modifie depuis Rapprochement, avec le bouton Insérer.',1);ask('Vider la source ?',`Toutes les lignes de DATA_RENTA_COUT seront supprimées de cet appareil. La base de référence et les insertions déjà enregistrées seront conservées.`,'Vider',async()=>{S.src=[];delete S.meta.src;delete S.imp.src;await save();render();toast('Source supprimée')})}
 else if(a==='apply'){const items=anoms().filter(r=>isNewKeyAbsent(r)&&S.sel.has(r.k));
  if(!items.length){toast('Aucune nouvelle ligne absente sélectionnée.',1);return}
  // Précontrôle : la Corresp clé doit être unique dans la base et dans le lot à insérer.
  const baseCles=new Set(S.ref.map(r=>normalizedCle(r)).filter(Boolean));
  const usedCles=new Set(),existingKeys=new Set(S.ref.map(r=>r.k));
  const newItems=[],duplicates=[];
  items.forEach(r=>{const ck=normalizedCle(r);
   if(ck&&baseCles.has(ck)){duplicates.push({row:r,why:'Corresp clé déjà présente dans la base'});return}
   if(ck&&usedCles.has(ck)){duplicates.push({row:r,why:'Corresp clé répétée dans la sélection'});return}
   if(!ck&&existingKeys.has(r.k)){duplicates.push({row:r,why:'Ligne déjà présente dans la base'});return}
   newItems.push(r);if(ck)usedCles.add(ck);existingKeys.add(r.k);
  });
  if(!newItems.length){S.sel.clear();render();toast(`${duplicates.length} ligne(s) ignorée(s) : leur Corresp clé existe déjà dans la base ou dans la sélection.`,1);return}
  const bad=newItems.find(r=>pNum(S.edits[r.k]??r.ca)==null);if(bad){toast('Montant invalide pour '+bad.client,1);return}
  const duplicateHtml=duplicates.length?`<div class="msg m-warn"><b>${duplicates.length} ligne(s) écartée(s) du lot</b> : leur Corresp clé existe déjà dans la base ou est répétée dans la sélection. Elles ne seront pas insérées.<ul>${duplicates.slice(0,8).map(d=>`<li><b>${esc(d.row.cle)||'(clé vide)'}</b> — ${esc(d.row.client||'(sans client)')} · ${MONTHS[d.row.mois-1]} ${d.row.annee} <span style="opacity:.8">(${esc(d.why)})</span></li>`).join('')}${duplicates.length>8?`<li>… et ${duplicates.length-8} autre(s)</li>`:''}</ul></div>`:'';
  ask('Vérification des Corresp clés',`<p>Avant l’insertion, chaque <b>Corresp clé</b> a été comparée à celles déjà enregistrées dans BUDGET | CA REALISEE.</p><div class="cmp"><div><small>Nouvelles lignes admissibles</small><b>${newItems.length}</b></div><div><small>Doublons écartés</small><b>${duplicates.length}</b></div><div><small>Action</small><b>Ajout seulement</b></div></div>${duplicateHtml}<p>Les lignes existantes et leurs montants resteront strictement inchangés.</p>`,'Confirmer l’insertion',async()=>{
   const currentCles=new Set(S.ref.map(r=>normalizedCle(r)).filter(Boolean));const currentKeys=new Set(S.ref.map(r=>r.k));let added=0,skipped=0;
   newItems.forEach(r=>{const ck=normalizedCle(r);if((ck&&currentCles.has(ck))||(!ck&&currentKeys.has(r.k))){skipped++;return}
    const v=r2(pNum(S.edits[r.k]??r.ca));const n={mois:r.mois,annee:r.annee,site:r.site,client:r.client,operation:r.operation,cle:r.cle,ca:v,k:r.k,o:'ajout'};S.ref.push(n);currentKeys.add(r.k);if(ck)currentCles.add(ck);added++;delete S.edits[r.k]
   });
   S.sel.clear();S.bpage=1;await save();render();toast(`${added} ligne(s) ajoutée(s). ${duplicates.length+skipped} doublon(s) ignoré(s).`)
  })}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='historyImportFile'){const file=t.files?.[0];t.value='';importLocalArchiveBackup(file);return}
 if(t.dataset.size!==undefined){S.size=+t.value;S.page=S.bpage=S.srcPage=1;if(S.view==='recon')renderTable();else if(S.view==='source')renderSource();else renderBBody();return}
 if(t.id==='dashOperation'){S.dashOperation=t.value;renderDashboard()}
 else if(t.id==='fy'){S.year=t.value;S.month='';S.page=S.bpage=1;render()}else if(t.id==='fm'){S.month=t.value;S.page=S.bpage=1;render()}
 else if(t.id==='srcYearFilter'){S.srcYear=t.value;S.srcMonth='';S.srcPage=1;render()}else if(t.id==='srcMonthFilter'){S.srcMonth=t.value;S.srcPage=1;render()}
 else if(t.id==='mode')S.mode=t.value;
 else if(t.dataset.file){handleFile(t.dataset.file,t.files[0]);t.value=''}
 else if(t.dataset.act==='selall'){const a=anoms().filter(isNewKeyAbsent);S.sel=t.checked?new Set(a.map(r=>r.k)):new Set();renderSide()}
 else if(t.dataset.sel!==undefined){t.checked?S.sel.add(t.dataset.sel):S.sel.delete(t.dataset.sel);renderSide()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='archiveSearch'){const caret=t.selectionStart;S.historyQ=t.value;renderHistory();const next=$('#archiveSearch');if(next){next.focus();try{next.setSelectionRange(caret,caret)}catch{}}}
 else if(t.id==='q'){S.q=t.value;S.page=1;renderTable()}else if(t.id==='bq'){S.bq=t.value;S.bpage=1;renderBBody()}else if(t.id==='srcq'){const caret=t.selectionStart;S.srcQ=t.value;S.srcPage=1;renderSource();const next=$('#srcq');if(next){next.focus();try{next.setSelectionRange(caret,caret)}catch{}}}
 else if(t.dataset.edit!==undefined)S.edits[t.dataset.edit]=t.value});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest('[data-drop]');if(!z)return;e.preventDefault();z.classList.toggle('on',ev==='dragover');if(ev==='drop')handleFile(z.dataset.drop,e.dataTransfer.files[0])}));
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')$('#dlg').close()});

/* Export */
function exportXlsx(){const v=view();if(!v.length)return toast('Rien à exporter',1);
 const row=r=>({'Mois':MONTHS[r.mois-1],'Année':r.annee,'SITE':r.site,'CLIENT':r.client,'OPERATION':r.operation,'Corresp clés':r.cle,'CA DATA_RENTA_COUT':r.ca,'CA BUDGET | CA REALISEE':r.refCa,'Écart':r.status==='conforme'?0:r.ecart,'Statut':isExistingKeyConflict(r)?LBL.clepresente[1]:LBL[r.status][1]});
 const wb=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a.length?a:[{Information:'Aucune anomalie détectée'}]),n);
 add('Rapprochement',v.map(row));add('À vérifier',anoms().map(row));
 const bud=r=>({'Mois':MONTHS[r.mois-1],'Année':r.annee,'SITE':r.site,'CLIENT':r.client,'OPERATION':r.operation,'Corresp clés':r.cle,'CA':r.ca});
 add('BUDGET | CA REALISEE',S.ref.filter(r=>!isAj(r)).map(bud));if(S.ref.some(isAj))add('Lignes insérées',S.ref.filter(isAj).map(bud));
 XLSX.writeFile(wb,`rapprochement_CA_${new Date().toISOString().slice(0,10)}.xlsx`)}

function exportBase(){const o=r=>isAj(r)?'Inséré':'Importé',row=r=>({'Mois':MONTHS[r.mois-1],'Année':r.annee,'SITE':r.site,'CLIENT':r.client,'OPERATION':r.operation,'Corresp clés':r.cle,'CA':r.ca,'Origine':o(r)}),wb=XLSX.utils.book_new(),mk=(n,a)=>a.length&&XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a.map(row)),n);
 mk('Consolidé',S.ref);mk('Importé',S.ref.filter(r=>!isAj(r)));mk('Inséré',S.ref.filter(isAj));XLSX.writeFile(wb,`BUDGET_CA_REALISEE_consolide_${new Date().toISOString().slice(0,10)}.xlsx`)}
document.addEventListener('keydown',e=>{const d=e.target.closest?.('[data-act="globaldetail"]');if(d&&(e.key==='Enter'||e.key===' ')){e.preventDefault();showGlobalDetail();return}if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){const q=$('#q')||$('#bq');if(q){e.preventDefault();q.focus()}}});
/* Démarrage */
(async()=>{try{const d=await dbGet('data');if(d){S.src=d.src||[];S.ref=d.ref||[];S.meta=d.meta||{}}const history=await dbGet('archiveHistory');S.history=Array.isArray(history)?history:[];const cfg=await dbGet('googleDriveConfig');if(cfg?.clientId)GD.config=cfg}catch(e){toast('Stockage local indisponible : les données ne seront pas conservées.',1)}render()})();
</script></body></html>
